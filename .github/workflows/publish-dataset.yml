name: publish-dataset

on:
  push:
    branches: [main]
    paths:
      - "data/csv/**"
      - "scripts/build.py"
      - "scripts/publish.py"
      - ".github/workflows/publish-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - run: python scripts/build.py
      - run: python scripts/build.py --check
      - run: python -m pytest tests/test_route.py -q
      - run: python scripts/publish.py
      - run: python scripts/publish.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
